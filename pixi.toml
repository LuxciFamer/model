[workspace]
name = "xinshui-pinn-hydro"
version = "0.1.0"
description = "Meta-PINN-Hydro rainfall-runoff modeling for Xinshui River basin"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<2.3"
scipy = ">=1.13"
pandas = ">=2.2"
scikit-learn = ">=1.5"
rasterio = ">=1.3"
geopandas = ">=1.0"
shapely = ">=2.0"
pyproj = ">=3.6"
matplotlib = ">=3.9"
seaborn = ">=0.13"
pyyaml = ">=6.0"
openpyxl = ">=3.1"
tqdm = ">=4.66"
pytest = ">=8.2"

[pypi-dependencies]
torch = { version = ">=2.5,<2.9", index = "https://download.pytorch.org/whl/cu126" }

[activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"

[tasks]
check-env = "python scripts/00_check_env.py"
test = "pytest -v tests/"
prepare-data = "python scripts/01_prepare_data.py"
train-baselines = "python scripts/02_train_baselines.py"
tune-pinn = "python scripts/03_optimize_pinn.py"
train-final = "python scripts/04_train_final_and_ablation.py"
evaluate-report = "python scripts/05_evaluate_and_report.py"
all = { depends-on = ["prepare-data", "train-baselines", "tune-pinn", "train-final", "evaluate-report"] }
public-benchmark = "python scripts/run_public_benchmark.py"
